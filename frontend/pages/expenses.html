<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly — Expenses</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">Spend<span>ly</span></div>
      <div class="logo-sub">Expense Tracker</div>
    </div>
    <nav class="nav-section">
      <div class="nav-label">Menu</div>
      <a href="../index.html" class="nav-link"><span class="icon">◈</span> Dashboard</a>
      <a href="expenses.html" class="nav-link active"><span class="icon">≡</span> Expenses</a>
      <a href="reports.html" class="nav-link"><span class="icon">◎</span> Reports</a>
      <a href="categories.html" class="nav-link"><span class="icon">⊞</span> Categories</a>
    </nav>
    <div class="sidebar-footer">v1.0 &nbsp;·&nbsp; Spring Boot + JS</div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Expenses</h1>
        <p class="page-subtitle" id="count-label">Loading…</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" onclick="exportCSV()">↓ Export CSV</button>
        <button class="btn btn-primary" onclick="openModal()">+ Add Expense</button>
      </div>
    </div>

    <div class="page-content fade-in">

      <!-- Filters -->
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="icon">⌕</span>
          <input class="form-control" id="search" placeholder="Search expenses…" oninput="debounceLoad()">
        </div>
        <select class="form-control filter-select" id="filter-cat" onchange="loadExpenses()">
          <option value="">All categories</option>
        </select>
        <input class="form-control" type="date" id="filter-start" onchange="loadExpenses()" style="width:160px">
        <input class="form-control" type="date" id="filter-end" onchange="loadExpenses()" style="width:160px">
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Clear</button>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0;overflow:hidden">
        <div id="table-wrap">
          <div class="loading"><div class="spinner"></div> Loading expenses…</div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="expenseModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Add Expense</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="expenseForm" onsubmit="submitExpense(event)">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input class="form-control" id="f-title" placeholder="e.g. Swiggy order" required>
          </div>
          <div class="form-group">
            <label class="form-label">Amount (₹) *</label>
            <input class="form-control" id="f-amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date *</label>
            <input class="form-control" id="f-date" type="date" required>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-control" id="f-category">
              <option value="">— Uncategorized —</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Payment Method</label>
            <select class="form-control" id="f-payment">
              <option value="CASH">💵 Cash</option>
              <option value="UPI">📱 UPI</option>
              <option value="CARD">💳 Card</option>
              <option value="BANK_TRANSFER">🏦 Bank Transfer</option>
              <option value="OTHER">• Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Note</label>
            <input class="form-control" id="f-note" placeholder="Optional">
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <h2 class="modal-title">Delete Expense</h2>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text2);margin-bottom:24px">Are you sure you want to delete <strong id="delete-name"></strong>? This cannot be undone.</p>
      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger-ghost" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
let allCategories = [];
let deleteTarget = null;
let debounceTimer;

async function init() {
  allCategories = await api.getCategories();
  populateCategorySelects(allCategories);
  await loadExpenses();
}

function populateCategorySelects(cats) {
  const filterSel = document.getElementById('filter-cat');
  const formSel = document.getElementById('f-category');
  cats.forEach(c => {
    filterSel.innerHTML += `<option value="${c.id}">${c.icon || ''} ${c.name}</option>`;
    formSel.innerHTML += `<option value="${c.id}">${c.icon || ''} ${c.name}</option>`;
  });
}

async function loadExpenses() {
  const params = {};
  const catId = document.getElementById('filter-cat').value;
  const start = document.getElementById('filter-start').value;
  const end = document.getElementById('filter-end').value;
  const keyword = document.getElementById('search').value.trim();
  if (catId) params.categoryId = catId;
  if (start) params.startDate = start;
  if (end) params.endDate = end;
  if (keyword) params.keyword = keyword;

  document.getElementById('table-wrap').innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';
  try {
    const expenses = await api.getExpenses(params);
    renderTable(expenses);
    document.getElementById('count-label').textContent = expenses.length + ' expense' + (expenses.length !== 1 ? 's' : '') + ' found';
  } catch(e) {
    document.getElementById('table-wrap').innerHTML = `<div class="empty-state"><h3>Error loading expenses</h3><p>${e.message}</p></div>`;
  }
}

function debounceLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadExpenses, 400);
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('filter-cat').value = '';
  document.getElementById('filter-start').value = '';
  document.getElementById('filter-end').value = '';
  loadExpenses();
}

function renderTable(expenses) {
  const wrap = document.getElementById('table-wrap');
  if (!expenses.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>No expenses found</h3><p>Try clearing filters or add a new expense.</p></div>`;
    return;
  }
  wrap.innerHTML = `<table class="expense-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Date</th>
        <th>Payment</th>
        <th>Note</th>
        <th style="text-align:right">Amount</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      ${expenses.map(e => `<tr>
        <td style="font-weight:500;max-width:180px">${e.title}</td>
        <td>${e.category ? catBadge(e.category.name, e.category.color) : '<span style="color:var(--text3)">—</span>'}</td>
        <td style="color:var(--text2);font-size:13px;white-space:nowrap">${formatDate(e.date)}</td>
        <td style="font-size:12px;color:var(--text2)">${paymentLabel(e.paymentMethod)}</td>
        <td style="font-size:12px;color:var(--text3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.note || '—'}</td>
        <td style="text-align:right;white-space:nowrap"><span class="amount">${formatCurrency(e.amount)}</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-icon btn-sm" onclick='openEditModal(${JSON.stringify(e)})' title="Edit">✎</button>
          <button class="btn btn-danger-ghost btn-icon btn-sm" onclick='openDeleteModal(${e.id}, "${e.title.replace(/"/g,'')}")' title="Delete">✕</button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

// Add/Edit modal
function openModal(expense = null) {
  document.getElementById('modal-title').textContent = expense ? 'Edit Expense' : 'Add Expense';
  document.getElementById('submit-btn').textContent = expense ? 'Update' : 'Save';
  document.getElementById('editId').value = expense?.id || '';
  document.getElementById('f-title').value = expense?.title || '';
  document.getElementById('f-amount').value = expense?.amount || '';
  document.getElementById('f-date').value = expense?.date || new Date().toISOString().split('T')[0];
  document.getElementById('f-category').value = expense?.category?.id || '';
  document.getElementById('f-payment').value = expense?.paymentMethod || 'UPI';
  document.getElementById('f-note').value = expense?.note || '';
  document.getElementById('expenseModal').classList.add('open');
}

function openEditModal(expense) { openModal(expense); }
function closeModal() { document.getElementById('expenseModal').classList.remove('open'); }

async function submitExpense(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = document.getElementById('editId').value;
  const data = {
    title: document.getElementById('f-title').value,
    amount: parseFloat(document.getElementById('f-amount').value),
    date: document.getElementById('f-date').value,
    categoryId: document.getElementById('f-category').value || null,
    paymentMethod: document.getElementById('f-payment').value,
    note: document.getElementById('f-note').value || null
  };
  try {
    if (id) { await api.updateExpense(id, data); showToast('Expense updated!'); }
    else { await api.createExpense(data); showToast('Expense added!'); }
    closeModal();
    loadExpenses();
  } catch(err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = id ? 'Update' : 'Save';
  }
}

// Delete modal
function openDeleteModal(id, name) {
  deleteTarget = id;
  document.getElementById('delete-name').textContent = '"' + name + '"';
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); deleteTarget = null; }
async function confirmDelete() {
  if (!deleteTarget) return;
  try {
    await api.deleteExpense(deleteTarget);
    showToast('Expense deleted');
    closeDeleteModal();
    loadExpenses();
  } catch(e) { showToast(e.message, 'error'); }
}

// CSV Export
async function exportCSV() {
  try {
    const expenses = await api.getExpenses();
    const rows = [['ID','Title','Amount','Date','Category','Payment','Note']];
    expenses.forEach(e => rows.push([
      e.id, `"${e.title}"`, e.amount, e.date,
      e.category?.name || '', e.paymentMethod, `"${e.note || ''}"`
    ]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = 'expenses_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    showToast('CSV exported!');
  } catch(e) { showToast('Export failed', 'error'); }
}

// Backdrop close
document.getElementById('expenseModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('deleteModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeDeleteModal(); });

init();
</script>
</body>
</html>
