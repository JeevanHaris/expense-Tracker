<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spendly — Categories</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .cat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .cat-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .cat-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .cat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .cat-card-actions { display: flex; gap: 8px; margin-top: 14px; }
    .color-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .color-dot {
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s;
    }
    .color-dot.selected, .color-dot:hover { border-color: white; transform: scale(1.15); }
  </style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">Spend<span>ly</span></div>
      <div class="logo-sub">Expense Tracker</div>
    </div>
    <nav class="nav-section">
      <div class="nav-label">Menu</div>
      <a href="../index.html" class="nav-link"><span class="icon">◈</span> Dashboard</a>
      <a href="expenses.html" class="nav-link"><span class="icon">≡</span> Expenses</a>
      <a href="reports.html" class="nav-link"><span class="icon">◎</span> Reports</a>
      <a href="categories.html" class="nav-link active"><span class="icon">⊞</span> Categories</a>
    </nav>
    <div class="sidebar-footer">v1.0 &nbsp;·&nbsp; Spring Boot + JS</div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Categories</h1>
        <p class="page-subtitle">Manage expense categories and budgets</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ New Category</button>
    </div>

    <div class="page-content fade-in">
      <div class="cat-grid" id="cat-grid">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Loading…</div>
      </div>
    </div>
  </main>
</div>

<!-- Category Modal -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">New Category</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="catForm" onsubmit="submitCategory(event)">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Name *</label>
            <input class="form-control" id="f-name" placeholder="e.g. Food & Dining" required>
          </div>
          <div class="form-group">
            <label class="form-label">Icon / Emoji</label>
            <input class="form-control" id="f-icon" placeholder="🍔" maxlength="4">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Color *</label>
          <input class="form-control" id="f-color" type="color" value="#C8F06E" style="height:44px;padding:4px 8px;cursor:pointer">
          <div class="color-presets" id="color-presets"></div>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <h2 class="modal-title">Delete Category</h2>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text2);margin-bottom:8px">Delete <strong id="delete-name"></strong>?</p>
      <p style="color:var(--text3);font-size:13px;margin-bottom:24px">Expenses in this category will become uncategorized.</p>
      <div style="display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger-ghost" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
const PRESET_COLORS = ['#FF6B6B','#FF8E53','#FFB347','#FFD93D','#C8F06E','#6BCB77','#4ECDC4','#45B7D1','#4D96FF','#9B5DE5','#F15BB5','#DDA0DD'];
let deleteTarget = null;

function renderPresets(selectedColor) {
  document.getElementById('color-presets').innerHTML = PRESET_COLORS.map(c =>
    `<div class="color-dot ${c.toLowerCase()===selectedColor.toLowerCase()?'selected':''}"
      style="background:${c}"
      onclick="selectColor('${c}')"></div>`
  ).join('');
}

function selectColor(hex) {
  document.getElementById('f-color').value = hex;
  renderPresets(hex);
}

async function loadCategories() {
  try {
    const [cats, summary] = await Promise.all([api.getCategories(), api.getSummary()]);
    const spendMap = {};
    summary.categoryBreakdown.forEach(c => { spendMap[c.category] = c.total; });
    renderGrid(cats, spendMap);
  } catch(e) {
    showToast('Failed to load categories', 'error');
  }
}

function renderGrid(cats, spendMap) {
  const grid = document.getElementById('cat-grid');
  if (!cats.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">⊞</div><h3>No categories yet</h3><p>Create your first category to organize expenses.</p></div>`;
    return;
  }
  grid.innerHTML = cats.map(c => {
    const spent = spendMap[c.name] ? formatCurrency(spendMap[c.name]) : null;
    return `<div class="cat-card" style="border-top-color:${c.color}">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${c.color}"></div>
      <div class="cat-card-header">
        <div class="cat-icon" style="background:${hexToRgba(c.color,0.15)};color:${c.color}">${c.icon || c.name[0]}</div>
        <div>
          <div style="font-weight:500;font-size:15px">${c.name}</div>
          ${spent ? `<div style="font-size:13px;color:var(--text2)">${spent} this month</div>` : '<div style="font-size:12px;color:var(--text3)">No expenses this month</div>'}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:12px;height:12px;border-radius:50%;background:${c.color};flex-shrink:0"></div>
        <span style="font-size:12px;color:var(--text3);font-family:monospace">${c.color}</span>
      </div>
      <div class="cat-card-actions">
        <button class="btn btn-ghost btn-sm" style="flex:1" onclick='openEditModal(${JSON.stringify(c)})'>✎ Edit</button>
        <button class="btn btn-danger-ghost btn-sm" onclick='openDeleteModal(${c.id}, "${c.name.replace(/"/g,"")}") '>✕</button>
      </div>
    </div>`;
  }).join('');
}

function openModal(cat = null) {
  document.getElementById('modal-title').textContent = cat ? 'Edit Category' : 'New Category';
  document.getElementById('submit-btn').textContent = cat ? 'Update' : 'Save';
  document.getElementById('editId').value = cat?.id || '';
  document.getElementById('f-name').value = cat?.name || '';
  document.getElementById('f-icon').value = cat?.icon || '';
  const color = cat?.color || '#C8F06E';
  document.getElementById('f-color').value = color;
  renderPresets(color);
  document.getElementById('catModal').classList.add('open');
}

function openEditModal(cat) { openModal(cat); }
function closeModal() { document.getElementById('catModal').classList.remove('open'); }

async function submitCategory(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const id = document.getElementById('editId').value;
  const data = {
    name: document.getElementById('f-name').value,
    color: document.getElementById('f-color').value,
    icon: document.getElementById('f-icon').value || null
  };
  try {
    if (id) { await api.updateCategory(id, data); showToast('Category updated!'); }
    else { await api.createCategory(data); showToast('Category created!'); }
    closeModal();
    loadCategories();
  } catch(err) {
    showToast(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = id ? 'Update' : 'Save';
  }
}

function openDeleteModal(id, name) {
  deleteTarget = id;
  document.getElementById('delete-name').textContent = '"' + name + '"';
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('open'); deleteTarget = null; }
async function confirmDelete() {
  if (!deleteTarget) return;
  try {
    await api.deleteCategory(deleteTarget);
    showToast('Category deleted');
    closeDeleteModal();
    loadCategories();
  } catch(e) { showToast(e.message, 'error'); }
}

document.getElementById('f-color').addEventListener('input', e => renderPresets(e.target.value));
document.getElementById('catModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('deleteModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeDeleteModal(); });

loadCategories();
</script>
</body>
</html>
